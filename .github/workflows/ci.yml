name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: 单元测试
        # 全部测试均为离线用例（LLM 与检索都用桩），不需要任何 API key。
        # 这一点是刻意保证的：CI 要是依赖外部服务，就没人会去修它。
        run: python -m pytest tests/ -q

      - name: 语料清洗冒烟
        # 清洗是纯规则、不调模型，可以在这里跑通，保证「克隆下来第一步」不会烂
        run: python scripts/01_clean_corpus.py
